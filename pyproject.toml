[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resumelens"
version = "0.1.0"
description = "Formal Language-Based Resume Screening System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyformlang>=1.0.10",
    "textx>=3.1.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
